name: Alerta

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Ejecutar y Notificar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ejecutar programa Hola Mundo
        run: node index.js

      - name: Enviar notificacion a ntfy
        run: |
          curl -d "Se ha realizado un push en la rama main por Sebastian Peguero (SebasPeguero)" https://ntfy.sh/devops-itla
